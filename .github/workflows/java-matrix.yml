name: Java compatibility

# One jar is compiled with --release 17 and verified on every supported JDK.
# LIVE and conformance suites need a real appliance and stay opt-in locally.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Verify offline suite
        run: mvn -B --no-transfer-progress verify

      - name: Check bytecode baseline
        shell: bash
        run: |
          major=$(javap -verbose target/classes/com/justybase/netezza/NetezzaDriver.class | awk '/major version/ {print $3}')
          echo "class file major version: $major (expected 61 for Java 17)"
          test "$major" = "61"

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: surefire-reports-jdk-${{ matrix.java }}
          path: target/surefire-reports
          if-no-files-found: ignore

  release-artifacts:
    name: Sources, Javadoc and module name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build release artifacts
        run: mvn -B --no-transfer-progress -DskipTests package

      - name: Check attached artifacts
        shell: bash
        run: |
          test -f target/netezza-sql-*-sources.jar
          test -f target/netezza-sql-*-javadoc.jar
          jar=$(ls target/netezza-sql-*.jar | grep -v -- '-sources.jar' | grep -v -- '-javadoc.jar' | head -1)
          unzip -p "$jar" META-INF/MANIFEST.MF | grep 'Automatic-Module-Name: com.justybase.netezza'
