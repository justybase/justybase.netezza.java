name: Publish release

# Triggered by a version tag (for example v0.1.0). The POM version must match the tag.
# Publishes the jar, sources and javadoc to GitHub Packages and attaches them to a GitHub Release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish package and create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Verify tag matches POM version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pom=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "tag=$tag pom=$pom"
          test "$tag" = "$pom" || { echo "Tag and POM version differ"; exit 1; }

      - name: Publish to GitHub Packages
        run: mvn -B --no-transfer-progress deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach jars to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/*.jar
          generate_release_notes: true
